description: >
  银狐(=Void Arachne/游蛇/UTG-Q-1000)AtlasCross RAT 直连专用C2 bifa668.com:9899
  (韩国 61.111.250.139),并以 typosquat 域(quickq-quickq.com 等)冒用QuickQ品牌投递。
references:
