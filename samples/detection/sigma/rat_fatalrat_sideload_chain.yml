title: FatalRAT 假软件投递与DLL侧加载链
id: 8f1c2a1a-0301-4a11-b011-fatalratchain01
status: experimental
description: >
  FatalRAT 经假软件/中文SEO投递(冒充 Chrome/Telegram/输入法,诱饵名含"转接口/音频调试/
  Chromele"),释放合法签名EXE + 恶意DLL做多阶段侧加载。命中此类诱饵命名的进程创建告警。
references:
  - MAL-2026-0301-QUICKQ
  - abuse.ch MalwareBazaar (tag=FatalRAT)
author: IR-team
date: 2026/07/01
logsource:
  product: windows
  category: process_creation
detection:
  selection_lure:
    CommandLine|contains:
      - '转接口'
      - '音频调试'
      - 'Chromele'
      - '语言包转'
  selection_sideload:
    ParentImage|contains:
      - '\AppData\Local\Temp\'
      - '\Downloads\'
    Image|endswith: '.exe'
  condition: selection_lure or (selection_sideload and selection_lure)
falsepositives:
  - 诱饵关键词较特异,误报低
level: high
tags:
  - attack.execution
  - attack.t1204.002
  - attack.t1574.002
